name: Publish npm packages

env:
  BLITZ_DEV_SERVER_ORIGIN: "https://stringtale.com"
  PUPPETEER_SKIP_DOWNLOAD: "true"
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
  SKIP_ENV_VALIDATION: "true"
  IS_REACT_ACT_ENVIRONMENT: "true"
  CI: "true"

on:
  push:
    branches:
      - main
      - release/**

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  # https://docs.npmjs.com/trusted-publishers
  id-token: write # Required for OIDC
  contents: write # Required for pushing tags/commits
  pull-requests: write # Required for changesets to create PRs
  # Add permission to update workflow files

jobs:
  publish:
    name: Publish npm packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      # Need to install everything because of https://github.com/changesets/changesets/issues/945
      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          publish: bun run release
        env:
          NPM_TOKEN: ""
          NODE_AUTH_TOKEN: ""
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NPM_TOKEN removed - using OIDC trusted publishing instead
